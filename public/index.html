<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Quotex Bot - Signals</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; background:#f5f7fb }
    header { background:#24292f; color:white; padding:12px 16px }
    main { padding:16px }
    .signal { background:white; padding:12px; border-radius:6px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,0.05) }
    .buy { border-left:6px solid #16a34a }
    .sell { border-left:6px solid #dc2626 }
    .meta { font-size:12px; color:#555 }
    #status { margin-left:8px; font-size:13px }
  </style>
</head>
<body>
  <header>
    <strong>Quotex Bot</strong>
    <span id="status">connecting...</span>
  </header>
  <main>
    <div id="signals"></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
